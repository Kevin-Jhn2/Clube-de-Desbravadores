<script>
        function addunidades(){
        var nomeUnidadeVar = iptUnidade.value;
        var idUsuarioVar = sessionStorage.ID_USUARIO;

        var unidades = JSON.parse(sessionStorage.UNIDADES)

            var naoencontrou = true;
            for(let i = 0; i < unidades.length; i++){
                if(unidades[i].nome == nomeUnidadeVar){
                    alert(`A unidade ${nomeUnidadeVar} já existe!`)
                    naoencontrou = false;
                    break
                }
            };

            if(!naoencontrou){
                return                
            }
     
     
        fetch("/unidades/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                nomeUnidadeServer: nomeUnidadeVar,
                idUsuarioServer: idUsuarioVar
            }),
        })
        .then(function (resposta) {
            console.log("resposta: ", resposta);

            alert(`A unidade ${nomeUnidadeVar} foi adicionada`);

            fetch("/unidades/ultimoId_unidade", {
              method: "GET",
              headers: {
                "Content-Type": "application/json"
              },
            }).then(function (response) {
                // console.log("resposta: ", resposta);
            
            if(response.ok){
                response.json().then(function(resposta) {
                    
                        console.log(`dados: ${JSON.stringify(resposta[0].id)}`);
                        // console.log(`dados: ${resposta.json()}`);
                        
                        var ultimoIdUnidade = JSON.stringify(resposta[0].id);
                        var unidadeVar = {
                            "id": ultimoIdUnidade,
                            "nome": nomeUnidadeVar,
                            "fkCadastro": sessionStorage.ID_USUARIO
                        }
                        var todasUnidades = JSON.parse(sessionStorage.UNIDADES);
                        todasUnidades.push(unidadeVar);
                        if(todasUnidades[0].nome == null){
                            todasUnidades.shift();
                        }
                        sessionStorage.UNIDADES = JSON.stringify(todasUnidades);

                })
            }
            })
        })
        .catch(function (resposta) {
            console.log(`#ERRO: ${resposta}`);
            finalizarAguardar()
        })

            

    
    }

    function delunidades(){
        var nomeUnidadeVar = iptUnidade.value;
        var idUsuarioVar = sessionStorage.ID_USUARIO;
        
        var confirmar = confirm(`Você deseja deletar ${nomeUnidadeVar}?`)

        if(!confirmar){
            alert("Exclusão cancelada");
            return;
        }else{
            alert("Exclusão em andamento")
        }

        fetch("/unidades/deletar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                nomeUnidadeServer: nomeUnidadeVar,
                idUsuarioServer: idUsuarioVar
            }),
        })
        .then(function (resposta) {
            console.log("resposta: ", resposta);
        })
        .catch(function (resposta) {
            console.log(`#ERRO: ${resposta}`);
            finalizarAguardar()
        })

    }

    }

    function addsituacao(){
